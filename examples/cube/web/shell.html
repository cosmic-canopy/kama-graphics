<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>@kama/graphics cube</title>
<!--
  The cube example's page: #canvas, emscripten's own name for a program's canvas, is its window, which `openIn` gives
  its CSS size. The page's query is the program's arguments (`cube.html?arg=--frames&arg=60`); with none it draws until
  the page closes. Its output goes to the console, which `kama run` carries to its terminal.
-->
<style>
  html, body { margin: 0; padding: 0; background: #111; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
  var Module = {
    arguments: new URLSearchParams(location.search).getAll('arg'),
    print: function (text) { console.log(text); },
    printErr: function (text) { console.error(text); },
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
